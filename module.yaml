# The manifest for spool-sync-prusa-connect: a Go process (main.go) that follows
# every printer and keeps SpoolSync's spools in step, and a browser bundle
# (ui/) with the Spools pages and a printer's Spools tab. It replaces the
# Materials extension: SpoolSync is the only inventory.
#
# `prusa-connect module add` reads it out of the release and writes one
# declaration from it.
#
# The namespace is absent on purpose. The host derives it from the repository
# address the operator installed, so no module can name another module's
# address. For this module that is life.honex.gitlab.aux.spoolsync.spool-sync-prusa-connect.

name: spool-sync-prusa-connect
# The kind the one instance is declared under. It offers the service runtime,
# which is what a module with a process needs.
kind: sink
version: 0.1.0
# The licence this module is released under. The marketplace shows it and
# refuses a release without one. An SPDX identifier is the usual form.
license: MIT
# What a marketplace card prints beside the name: the title a person reads,
# one sentence about this module, and who answers for it. The install copies
# them into the declaration, so `GET /api/v1/resources` carries them for an
# installed module. Write your own sentence here, a title if the name alone reads badly, and your name or
# your team's beside it.
title: SpoolSync
summary: Your SpoolSync spools in Prusa Connect, with the weight on each printer tool kept in step.
codeowner: SpoolSync
# The module wire major the process half speaks.
contract_major: 1
# Where the fragment describing the routes is, inside this repository.
openapi: openapi.json
# The platforms the release ships a binary for, each a GOOS_GOARCH pair. Drop
# the ones you do not build, and add the ones you do.
platforms:
  - linux_amd64
  - linux_arm64
  - darwin_arm64
  - windows_amd64

# Every setting this module reads, each with its type, its default and one
# sentence saying what it controls. The host sends them on plugin.configure.
options:
  - key: spoolsync_url
    type: url
    required: true
    summary: The address of the SpoolSync server, such as https://spools.example.net, without /api/v1.
  - key: spoolsync_token
    type: secret
    required: true
    summary: A SpoolSync API token (ss_...) with every spools, filament_types and storage permission (view, create, edit, delete), and printers view and edit. SpoolSync's "Prusa Connect" token preset has them.
  - key: max_spools
    type: int
    default: "2000"
    summary: How many spools the module lets SpoolSync hold before it refuses to add another.

require:
  core-device.list: "*"
  core-device.get: "*"
  core-bus.subscribe: "*"
  core-access.check: "*"

# A database of its own: which SpoolSync spool a person put on a tool that
# reads no tag, and the last odometer reading of each tool. A SQLite file in
# the module's data directory unless the operator picks Postgres at install.
needs:
  database: true

# The one connection outside Prusa Connect: the SpoolSync server the operator names.
egress:
  - option: spoolsync_url
    why: Reads and edits the operator's SpoolSync spools and filament types, and sets the weight of each spool on a printer tool.
    sends: The spools a person adds or edits, the OpenPrintTag instance UUID of tagged spools, and each spool's weight in grams.

# Read every printer and its event stream, to follow the spool on each tool.
permissions:
  - observe
# Ask whether a person may operate a printer before changing which spool is on
# one of its tools. The module never operates a printer itself, so it only asks.
checks:
  - operate

# What other modules are told, on the host's event stream: a tool whose
# material or spool changed, and a spool that changed. The payloads are the
# Materials extension's, under this module's namespace.
events:
  tool: tool
  spool: spool

ui:
  # The built bundle's entry, relative to the bundle root.
  entry: ui/index.js
  # The range of @prusa/connect-ui this bundle was built against.
  library: ">=0.1.0-beta.1 <1.0.0"
  exports:
    - name: printer-positions
  contributes:
    # The whole of what this bundle may register. Each entry has one
    # host.register call behind it in ui/src/index.ts. The paths and ids are
    # Materials' own, so links carry over.
    pages:
      - path: spoolsync
        title: SpoolSync
        icon: materials
      # The old address, kept so a link or bookmark to it still opens the page.
      - path: materials
        title: SpoolSync
        hidden: true
      - path: material
        title: Material
        hidden: true
    settings:
      - id: catalogue
        title: Catalogue
      - id: locations
        title: Locations
    # The Tools tab of the printer page: what is on each tool or MMU slot,
    # with Assign, Change, Unload and Unassign.
    device_tab:
      - id: tools
        title: Tools

# The memory in MiB the server may budget for the process, children included.
# needs:
#   memory_mib: 256
