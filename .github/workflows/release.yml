name: Publish to the Plugin Marketplace

# This repository is a mirror of
# https://gitlab.honex.life/spoolsync/spool-sync-prusa-connect. A tag
# v<version> pushed there (the version in module.yaml) is mirrored here and
# hands the commit to the marketplace's builder. It builds every platform and
# the browser bundle itself, signs the release with the key in the environment
# `release`, and uploads it with the commit's source. A person at Prusa reviews
# it before operators can install it.
#
# The marketplace's trusted publisher names this repository, this workflow
# file (release.yml) and the environment `release`.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: marketplace-release
  cancel-in-progress: false

jobs:
  notes:
    name: Release notes
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # The section of CHANGELOG.md under the heading of module.yaml's version.
      - id: notes
        run: |
          set -eu
          VERSION=$(sed -n 's/^version:[ 	]*//p' module.yaml | head -1)
          {
            echo 'notes<<RELEASE_NOTES_END'
            awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md
            echo 'RELEASE_NOTES_END'
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Publish
    needs: notes
    uses: prusa3d/prusa-connect-marketplace-publish/.github/workflows/publish.yml@v1
    with:
      path: .
      module: spool-sync.com/connect
      node-version: '26'
      bundle-command: sh scripts/marketplace-bundle.sh
      bundle-output: marketplace-bundle
      changelog: ${{ needs.notes.outputs.notes }}
      environment: release
    # By name: `secrets: inherit` does not reach the builder, which lives in
    # another organisation (prusa3d).
    secrets:
      PRUSA_CONNECT_EXTENSION_SIGNING_KEY: ${{ secrets.PRUSA_CONNECT_EXTENSION_SIGNING_KEY }}
    permissions:
      contents: read
      id-token: write     # lets the run prove which repository, workflow and builder it is
      attestations: write # the build provenance of the archive and every binary
