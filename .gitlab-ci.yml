# ---------------------------------------------------------------------------
# spool-sync-prusa-connect: GitLab CI/CD
#
# Every MR and main push: vet, test and build the release archive.
#
# main  -> deploy:connect installs the build on connect.honex.life. A main
#          build is version <module.yaml version>-dev.<pipeline iid>, so each
#          push is a new release to Connect and a tagged <version> is newer
#          than all of them. Connect downloads only over public https, so the
#          archive goes through the Honex CDN under one stable name, fetched
#          with ?build=<pipeline iid> so Cloudflare never serves an older one:
#            https://cdn.honex.life/file/spool-sync/spool-sync-prusa-connect-dev.tar.gz
#
# v*    -> publish puts the release on the Honex CDN for published builds
#          (installs elsewhere). Nothing is deployed from a tag.
#            file https://cdn.honex.life/file/spool-sync/spool-sync-prusa-connect-<version>.tar.gz
#            KV   https://cdn.honex.life/value-store/spool-sync/spool-sync-prusa-connect
#                 {module, version, url, sha256, commit, published_at}
#          The tag must be v<version in module.yaml>; build fails otherwise.
#
# Runners follow the honex-ci conventions: hetzner-* are fresh Hetzner VMs.
#
# Requires:
#   HONEX_CDN_TOKEN      cdnkey.* token scoped to the `spool-sync` namespace
#                        (masked; if protected, protect v* tags too)
#   CONNECT_ADMIN_TOKEN  Connect token with the admin role (masked)
# ---------------------------------------------------------------------------

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

stages:
  - test
  - build
  - deploy

variables:
  CDN_BASE: "https://cdn.honex.life"
  CDN_NS: "spool-sync"
  MODULE: "gitlab.honex.life/spoolsync/spool-sync-prusa-connect"

.go: &go
  image: golang:1.26-bookworm
  tags: [hetzner-small]
  variables:
    GOFLAGS: -mod=readonly

.rules: &rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
  - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  - if: $CI_PIPELINE_SOURCE == "web"

test:
  <<: *go
  stage: test
  timeout: 20m
  rules: *rules
  script:
    - go vet ./...
    - go test -race ./...

build:
  <<: *go
  stage: build
  timeout: 20m
  rules: *rules
  needs: [test]
  script:
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        TAG="$CI_COMMIT_TAG" sh scripts/release.sh
      else
        SUFFIX="dev.$CI_PIPELINE_IID" sh scripts/release.sh
      fi
  artifacts:
    name: "spool-sync-prusa-connect-$CI_COMMIT_SHORT_SHA"
    expire_in: 30 days
    paths:
      - dist/*.tar.gz
      - dist/*.tar.gz.sha256
      - dist/version

# Uploads $1 to the CDN as $2 and fails unless $CDN_BASE/file/$CDN_NS/$2$4
# serves back the bytes whose sha256 is $3, the digest Connect holds the
# download to. Cloudflare caches /file/ by URL, query string included, so $4
# (such as ?build=42) gets past a cached copy of an earlier upload.
.cdn: &cdn
  - apk add --no-cache curl jq
  - |
    cdn_upload() {
      if [ -z "${HONEX_CDN_TOKEN:-}" ]; then
        echo "HONEX_CDN_TOKEN is not set (a protected variable needs a protected ref)" >&2
        return 1
      fi
      echo "Uploading $1 as $2"
      curl -fsS -X POST \
        -H "Authorization: $HONEX_CDN_TOKEN" \
        -F "file=@$1" \
        --form-string "filename=$2" \
        "$CDN_BASE/api/cdn/files/$CDN_NS" \
        -o /dev/null
      got=$(curl -fsSL "$CDN_BASE/file/$CDN_NS/$2${4:-}" | sha256sum | cut -d' ' -f1)
      if [ "$got" != "$3" ]; then
        echo "$CDN_BASE/file/$CDN_NS/$2${4:-} serves sha256 $got, the build made $3" >&2
        return 1
      fi
    }

# ---------------------------------------------------------------------------
# deploy:connect — every main push is installed on connect.honex.life.
# Installing over an installed release is the update: settings and the
# SpoolSync token are kept, and a permission an operator took away stays away.
# resource_group runs one deploy at a time, so the stable CDN name is never
# overwritten between this job's upload and Connect's download; Connect
# refuses a download whose sha256 differs anyway.
# ---------------------------------------------------------------------------

deploy:connect:
  stage: deploy
  tags: [hetzner-small]
  image: alpine:3.22
  interruptible: false
  resource_group: connect-honex
  environment:
    name: connect-honex
    url: https://connect.honex.life
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "web"
  needs:
    - job: build
      artifacts: true
  variables:
    CONNECT_URL: "https://connect.honex.life"
  before_script: *cdn
  script:
    - |
      set -eu
      if [ -z "${CONNECT_ADMIN_TOKEN:-}" ]; then
        echo "deploy: CONNECT_ADMIN_TOKEN is not set" >&2
        exit 1
      fi

      VERSION=$(cat dist/version)
      ARCHIVE="dist/spool-sync-prusa-connect-$VERSION.tar.gz"
      SHA256=$(cat "$ARCHIVE.sha256")
      NAME="spool-sync-prusa-connect-dev.tar.gz"
      BUST="?build=$CI_PIPELINE_IID"

      cdn_upload "$ARCHIVE" "$NAME" "$SHA256" "$BUST"

      jq -n --arg module "$MODULE" --arg version "$VERSION" \
            --arg from "$CDN_BASE/file/$CDN_NS/$NAME$BUST" --arg sha256 "$SHA256" \
            '{module: $module, version: $version, from: $from, sha256: $sha256, approve: true}' > body.json
      cat body.json

      status=$(curl -sS -o answer.json -w '%{http_code}' -X POST \
        -H "Authorization: Bearer $CONNECT_ADMIN_TOKEN" \
        -H "Content-Type: application/json" \
        --data-binary @body.json \
        "$CONNECT_URL/api/v1/modules")
      jq . answer.json || cat answer.json

      case "$status" in
        2??) ;;
        *) echo "deploy: Connect answered $status" >&2; exit 1 ;;
      esac

      state=$(jq -r '.state // empty' answer.json)
      echo "Installed $VERSION on $CONNECT_URL, state ${state:-unknown}"
      if [ "$state" = failed ]; then
        echo "deploy: the module did not start: $(jq -r '.reason // empty' answer.json)" >&2
        exit 1
      fi

# ---------------------------------------------------------------------------
# publish — a v* tag goes on the CDN for published builds. Each release keeps
# its own file name, so its URL and sha256 never drift apart.
# ---------------------------------------------------------------------------

publish:
  stage: deploy
  tags: [hetzner-small]
  image: alpine:3.22
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]/
  needs:
    - job: build
      artifacts: true
  variables:
    KV_KEY: "spool-sync-prusa-connect"
  before_script: *cdn
  script:
    - |
      set -eu
      VERSION=$(cat dist/version)
      ARCHIVE="dist/spool-sync-prusa-connect-$VERSION.tar.gz"
      NAME=$(basename "$ARCHIVE")
      SHA256=$(cat "$ARCHIVE.sha256")
      URL="$CDN_BASE/file/$CDN_NS/$NAME"

      cdn_upload "$ARCHIVE" "$NAME" "$SHA256"

      latest=$(jq -n \
        --arg module  "$MODULE" \
        --arg version "$VERSION" \
        --arg url     "$URL" \
        --arg sha256  "$SHA256" \
        --arg commit  "$CI_COMMIT_SHA" \
        --arg date    "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        '{module: $module, version: $version, url: $url, sha256: $sha256, commit: $commit, published_at: $date}')
      echo "$latest"

      jq -n --arg key "$KV_KEY" --arg value "$latest" '{key: $key, value: $value, type: "json"}' |
        curl -fsS -X POST \
          -H "Authorization: $HONEX_CDN_TOKEN" \
          -H "Content-Type: application/json" \
          --data-binary @- \
          "$CDN_BASE/api/cdn/kv/$CDN_NS" \
          -o /dev/null

      echo "Published $VERSION: $URL"
      echo "Latest: $CDN_BASE/value-store/$CDN_NS/$KV_KEY"
